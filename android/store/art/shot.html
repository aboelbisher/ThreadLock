<!doctype html>
<!-- One store screenshot, 1080 x 1920: a caption over the phone screen.
     shot.html?img=<capture path>&title=...&sub=...&tint=<css colour>  (make_store_art.ps1 fills these in) -->
<meta charset="utf-8">
<link rel="stylesheet" href="page.css">
<style>
  body { width: 1080px; height: 1920px; position: relative;
    background: radial-gradient(120% 70% at 50% 0%, var(--tint) 0%, #0D141C 45%, #070B10 100%); }
  h1 { position: absolute; top: 64px; width: 100%; margin: 0; text-align: center; font-weight: 400; font-size: 92px;
    color: #FFC24D; text-shadow: 0 5px 0 #0008; letter-spacing: 1px; }
  p { position: absolute; top: 186px; width: 100%; margin: 0; text-align: center; font-size: 46px; color: #fff;
    text-shadow: 0 4px 0 #0008; }
  .phone { position: absolute; top: 300px; left: 50%; height: 1580px; transform: translateX(-50%);
    border-radius: 56px; overflow: hidden; box-shadow: 0 0 0 10px #ffffff14, 0 0 60px var(--tint); }
  .phone img { display: block; height: 100%; }
</style>
<h1 id="t"></h1><p id="s"></p><div class="phone"><img id="i"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('title');
  document.getElementById('s').textContent = q.get('sub');
  document.getElementById('i').src = q.get('img');
  document.body.style.setProperty('--tint', q.get('tint') || '#1d3550');
</script>
