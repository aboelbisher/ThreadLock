<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="512" height="512">
  <!-- Threadlock's icon (B, the junction): the launcher icon's middle 72 of 108, with real glow. Play rounds the corners itself. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#14202E"/><stop offset="1" stop-color="#070B10"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2D08A"/><stop offset=".5" stop-color="#C9A15A"/><stop offset="1" stop-color="#7A5A2A"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="188" height="200"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-40" y="-40" width="188" height="200"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>
  <circle cx="54" cy="60" r="26" fill="#3DA1FF" opacity=".12" filter="url(#soft)"/>
  <path d="M22 26 C34 34 40 46 46 54" fill="none" stroke="#3DA1FF" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M86 26 C74 34 68 46 62 54" fill="none" stroke="#FFAB29" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M54 72 V92" stroke="#0A121A" stroke-width="12" stroke-linecap="round"/>
  <circle cx="54" cy="60" r="16" fill="#0A121A" stroke="url(#brass)" stroke-width="6"/>
  <circle cx="49" cy="59" r="4" fill="#3DA1FF" filter="url(#glow)"/><circle cx="59" cy="61" r="4" fill="#FFAB29" filter="url(#glow)"/>
</svg>
